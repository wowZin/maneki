# Admin 后台 Nginx 配置（安全增强版）

server {
    listen 80;
    server_name admin.yourdomain.com;

    # 强制 HTTPS（生产环境启用）
    # return 301 https://$server_name$request_uri;

    # 客户端请求限制
    limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=admin_conn:10m;

    location / {
        # 限流
        limit_req zone=admin_limit burst=20 nodelay;
        limit_conn admin_conn 10;

        root /var/www/admin;
        index index.html;
        try_files $uri $uri/ /index.html;

        # ========== 安全响应头 ==========

        # 禁止 iframe 嵌入（防止点击劫持）
        add_header X-Frame-Options "DENY" always;

        # 禁止 MIME 嗅探
        add_header X-Content-Type-Options "nosniff" always;

        # XSS 保护（现代浏览器）
        add_header X-XSS-Protection "1; mode=block" always;

        # Referrer 策略
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 内容安全策略（CSP）
        # 根据实际需求调整
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.yourdomain.com; frame-ancestors 'none';" always;

        # 权限策略
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

        # 删除服务器版本信息
        server_tokens off;

        # 缓存控制（敏感页面不缓存）
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # API 代理
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 更强的 API 限流
        limit_req zone=admin_limit burst=10 nodelay;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 禁止访问敏感文件
    location ~ /\. {
        deny all;
        return 403;
    }

    location ~ /(\.env|\.git|\.svn|\.htaccess|config\.json|package\.json) {
        deny all;
        return 403;
    }

    # 日志
    access_log /var/log/nginx/admin_access.log;
    error_log /var/log/nginx/admin_error.log;
}

